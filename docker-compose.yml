version: '3.8'

services:
  waste-auth-service:
    image: waste-management-api:latest
    ports:
      - "8000:8000"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/waste_mgmt
      - JWT_SECRET=your_secret_key
    depends_on:
      - db

  route-manager:
    image: route-manager:latest
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/waste_mgmt
    depends_on:
      - db

  media-service:
    image: media-service:latest
    ports:
      - "8082:8082"
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=waste_mgmt
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_pass
    ports:
      - "5432:5432"
